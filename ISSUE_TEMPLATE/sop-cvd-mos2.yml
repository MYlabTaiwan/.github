name: CVD Growth of MoS2
description: Log a chemical vapor deposition run for MoS2.
title: "[CVD] MoS2 Growth - <Date>"
labels: ["experiment", "synthesis", "cvd"]
body:
  - type: input
    id: substrate
    attributes:
      label: Substrate
      description: Substrate type and cleaning prep.
    validations:
      required: true
  - type: input
    id: precursors
    attributes:
      label: Precursors & Amounts
      description: e.g., 15mg MoO3, 100mg S
    validations:
      required: true
  - type: input
    id: gas_flow
    attributes:
      label: Gas Flow (sccm)
      description: e.g., Ar 50 sccm, H2 5 sccm
  - type: input
    id: temperatures
    attributes:
      label: Temperature Profile
      description: Target temp, ramp rate, and dwell time.
      placeholder: e.g., 750C for 15 mins (15C/min ramp)
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Growth Results
      description: Monolayer yield? Triangle size? Attach Raman/PL or optical data.
